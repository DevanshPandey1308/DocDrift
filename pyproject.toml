[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docdrift-workspace"
version = "0.1.0"
description = "Deterministic documentation drift checking for Python repositories"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
docdrift = "docdrift_cli.main:main"

[tool.setuptools.packages.find]
where = ["packages/core/src", "packages/cli/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "packages/core/src:packages/cli/src"
