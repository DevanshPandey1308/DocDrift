[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docdrift-workspace"
version = "0.1.0"
description = "Deterministic documentation drift checking for Python repositories"
requires-python = ">=3.12"
dependencies = ["markdown-it-py>=3,<5"]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "arq>=0.28,<0.29",
    "httpx>=0.27,<1",
    "PyJWT[crypto]>=2.8,<3",
]
llm = ["anthropic>=0.75,<1"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[project.scripts]
docdrift = "docdrift_cli.main:main"

[tool.setuptools.packages.find]
where = ["packages/core/src", "packages/cli/src", "apps/api/src", "apps/worker/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "packages/core/src:packages/cli/src"
